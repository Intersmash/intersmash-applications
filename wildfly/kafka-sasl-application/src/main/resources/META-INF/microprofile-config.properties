mp.messaging.connector.smallrye-kafka.bootstrap.servers=${mp.messaging.connector.smallrye.kafka.bootstrap.servers}

mp.messaging.outgoing.to-sasl.connector=smallrye-kafka
mp.messaging.outgoing.to-sasl.topic=testing
mp.messaging.outgoing.to-sasl.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Configure the Kafka source (we read from it)
mp.messaging.incoming.from-sasl.connector=smallrye-kafka
mp.messaging.incoming.from-sasl.topic=testing
mp.messaging.incoming.from-sasl.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configure Kafka group.id to prevent warn message - if not set, some default value is generated automatically.
mp.messaging.connector.smallrye-kafka.group.id="microprofile-reactive-messaging-kafka-group-id"
